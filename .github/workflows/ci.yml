name: Core Package CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  validate:
    name: PHP ${{ matrix.php }} - Composer & Style Validation
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis, bcmath, intl, mbstring, curl, zip
          tools: pint
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Verify Code Style (Laravel Pint)
        run: pint --test
